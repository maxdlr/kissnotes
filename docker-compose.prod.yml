services:
  db:
    container_name: ${APP_NAME}-db-prod
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_ROOT_USERNAME: root
      MARIADB_DATABASE: ${APP_NAME}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-proot", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  back:
    container_name: ${APP_NAME}-back-prod
    build:
      context: .
      dockerfile: apps/back/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME}
      BACK_PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      CORS_ORIGIN_URL: http://localhost
      EC_KEY: ${EC_KEY}
      EC_SALT: ${EC_SALT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}

  front:
    container_name: ${APP_NAME}-front-prod
    build:
      context: .
      dockerfile: apps/front/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api
    restart: always
    depends_on:
      - back

  nginx:
    container_name: ${APP_NAME}-nginx
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - front
      - back

volumes:
  db-data:
