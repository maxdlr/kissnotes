services:
  db:
    container_name: ${APP_NAME}-db-prod
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_USERNAME: ${DB_USERNAME}
      MARIADB_DATABASE: ${APP_NAME}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-proot", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
      - shared_proxy_network

  back:
    container_name: ${APP_NAME}-back-prod
    build:
      context: .
      dockerfile: apps/back/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_NAME: ${APP_NAME}
      BACK_PORT: ${BACK_PORT}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      CORS_ORIGIN_URL: https://kissnotes.maxdlr.com
      EC_KEY: ${EC_KEY}
      EC_SALT: ${EC_SALT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
    networks:
      - internal
      - shared_proxy_network

  front:
    container_name: ${APP_NAME}-front-prod
    build:
      context: .
      dockerfile: apps/front/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://kissnotes.maxdlr.com/api
    restart: always
    depends_on:
      - back
    networks:
      - shared_proxy_network

  nginx:
    container_name: ${APP_NAME}-nginx
    image: nginx:alpine
    restart: always
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - front
      - back
    networks:
      - shared_proxy_network

volumes:
  db-data:

networks:
  internal:
  shared_proxy_network:
    external: true
