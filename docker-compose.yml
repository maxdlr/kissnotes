services:
  kissnotes-db:
    container_name: $DB_CONTAINER_NAME
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_ROOT_USERNAME: root
    ports:
      - $DB_PORT:3306
  adminer:
    container_name: $DB_CONTAINER_NAME-adminer
    image: adminer
    restart: always
    ports:
      - $ADMINER_PORT:8080
